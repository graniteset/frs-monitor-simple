<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FRS Monitor</title><style>
:root{color-scheme:dark;--bg:#111820;--line:#344654;--text:#eaf2f7;--muted:#91a4b2;--cyan:#29d3c2}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif;overscroll-behavior:none}header{flex:none;padding:12px 16px 8px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:19px;margin:0}.session-label{color:var(--muted);margin-right:auto}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button{border:1px solid #50616e;background:#24323d;color:var(--text);padding:9px 13px;border-radius:7px;font-weight:650;touch-action:manipulation}button.active{background:#146b65;border-color:var(--cyan)}button.live{color:#ff6d6d}.squelch{display:flex;align-items:center;gap:6px}.squelch input{width:min(220px,38vw)}main{flex:1;min-height:0;display:flex;padding:0 12px 12px}.plot-shell{flex:1;min-height:0;background:#0a1117;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}canvas{display:block;width:100%;height:100%;min-height:0;touch-action:none}.status{position:absolute;left:12px;top:10px;background:#071017d9;border:1px solid #425767;border-radius:6px;padding:6px 9px;pointer-events:none}.status:empty{display:none}.hint{color:var(--muted);font-size:13px}@media(max-width:700px){header{padding:8px}h1{width:100%;font-size:17px}.session-label{width:100%;font-size:12px}main{padding:0}.plot-shell{border-radius:0}button{padding:10px}.hint{display:none}}
</style></head><body><header><h1 id="heading">22-channel FRS monitor</h1><span id="sessionLabel" class="session-label"></span><div class="controls"><button id="audio">Live audio: off</button><button id="live" class="live">● Live</button><button id="stopPlayback" hidden>■ Stop playback</button><label id="sqWrap" class="squelch">Squelch <input id="sq" type="range" min="-100" max="-20" value="-55"><output id="sqv">-55 dB</output></label></div><span class="hint">Drag or scroll through history · tap a conversation border to play its channel timeline</span></header><main><div class="plot-shell"><canvas id="plot"></canvas><div id="status" class="status"></div></div></main>
<script>
const TOKEN='__TOKEN__', CENTER=__CENTER__, RATE=__RATE__, AUDIO_RATE=__AUDIO_RATE__, AUDIO_CHUNK_BYTES=AUDIO_RATE/50*2, ARCHIVED=__ARCHIVED__, SESSION_LABEL=__SESSION_LABEL__, SPAN=30, LIVE_AV_DELAY=.32;
const api=p=>`${p}${p.includes('?')?'&':'?'}token=${TOKEN}`;
const canvas=document.querySelector('#plot'),ctx=canvas.getContext('2d'),raster=document.createElement('canvas'),rasterCtx=raster.getContext('2d'),statusEl=document.querySelector('#status');
let frames=[],records=[],after=0,offset=0,browseEnd=null,timelineStart=0,timelineEnd=0,timelineLive=!ARCHIVED,drag=null,moved=false,playing=null,playStart=0,playbackCtx=null,playbackNext=0,playbackAbort=null,playbackSources=[],notice='',noticeUntil=0,audioCtx=null,audioNext=0,audioOn=false,audioAbort=null,audioSources=[],rasterKey='',framesVersion=0,lastPaint=0,binMap=new Uint16Array(0),binMapWidth=0,binMapBins=0,historyTimer=null,historyGeneration=0,historyLoading=false;
document.querySelector('#sessionLabel').textContent=SESSION_LABEL;if(ARCHIVED){document.querySelector('#heading').textContent='FRS session browser';document.querySelector('#audio').hidden=true;document.querySelector('#sqWrap').hidden=true;document.querySelector('#live').textContent='● End'}
const low=CENTER-RATE/2;
const palette=new Uint8ClampedArray(256*3);for(let q=0;q<256;q++){let v=q/255,r=Math.max(0,Math.min(1,4*(v-.62))),g=Math.max(0,Math.min(1,1.6-3.2*Math.abs(v-.55))),b=Math.max(0,Math.min(1,1.35-2.7*v)),i=q*3;palette[i]=r*255;palette[i+1]=g*255;palette[i+2]=b*255}
function resize(){const dpr=devicePixelRatio||1,r=canvas.getBoundingClientRect(),width=Math.round(r.width*dpr),height=Math.round(r.height*dpr);if(canvas.width===width&&canvas.height===height)return;canvas.width=width;canvas.height=height;ctx.setTransform(dpr,0,0,dpr,0,0);rasterKey='';draw()} addEventListener('resize',resize);new ResizeObserver(resize).observe(canvas);
function plotRect(){return{x:64,y:34,w:canvas.clientWidth-78,h:canvas.clientHeight-84}}
function binsFor(width,count){if(binMapWidth!==width||binMapBins!==count){binMapWidth=width;binMapBins=count;binMap=new Uint16Array(width);for(let x=0;x<width;x++)binMap[x]=Math.floor(x/width*count)}return binMap}
function avDelay(){return timelineLive&&browseEnd===null&&audioOn?LIVE_AV_DELAY:0}function viewEnd(){return (browseEnd===null?timelineEnd:browseEnd)-avDelay()}
function maxOffset(){return Math.max(0,timelineEnd-timelineStart-SPAN)}function setOffset(value,force=false){offset=Math.max(0,Math.min(maxOffset(),value));browseEnd=offset>.05?timelineEnd-offset:null;queueHistory(force)}
function applyTimeline(t){if(!t)return;timelineStart=t.start;timelineEnd=t.end;timelineLive=t.live;if(browseEnd!==null)offset=Math.max(0,timelineEnd-browseEnd);else offset=0}
function yFor(t,p,end){return p.y+p.h-(end-t)/SPAN*p.h} function xFor(freq,p){return p.x+(freq-low)/RATE*p.w}
let hits=[];
function draw(){const p=plotRect(),end=viewEnd(),start=end-SPAN,w=Math.max(1,Math.floor(p.w)),h=Math.max(1,Math.floor(p.h));ctx.fillStyle='#111820';ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);ctx.fillStyle='#00121c';ctx.fillRect(p.x,p.y,p.w,p.h);
 const key=`${framesVersion}|${start.toFixed(3)}|${w}|${h}`;if(key!==rasterKey){rasterKey=key;raster.width=w;raster.height=h;const visible=frames.filter(f=>f.t>=start&&f.t<=end),img=rasterCtx.createImageData(w,h),map=visible.length?binsFor(w,visible[0].row.length):binMap;for(const f of visible){const y=Math.max(0,Math.min(h-1,Math.floor((f.t-start)/SPAN*h))),row=f.row;for(let yy=y;yy<Math.min(h,y+2);yy++)for(let x=0;x<w;x++){const q=row[map[x]],c=q*3,i=(yy*w+x)*4;img.data[i]=palette[c];img.data[i+1]=palette[c+1];img.data[i+2]=palette[c+2];img.data[i+3]=255}}rasterCtx.putImageData(img,0,0)}if(raster.width)ctx.drawImage(raster,0,0,w,h,p.x,p.y,p.w,p.h);
 ctx.strokeStyle='#7f95a3';ctx.lineWidth=1;ctx.strokeRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#a9bac5';ctx.font=`${canvas.clientWidth<600?10:12}px system-ui`;ctx.textAlign='center';const tickIntervals=canvas.clientWidth<600?4:8;for(let i=0;i<=tickIntervals;i++){let x=p.x+i/tickIntervals*p.w;ctx.fillText(((low+i*RATE/tickIntervals)/1e6).toFixed(3),x,p.y+p.h+20)}ctx.fillText('Frequency (MHz)',p.x+p.w/2,p.y+p.h+35);ctx.fillText(`${SPAN} seconds`,p.x+48,p.y+16);
 const playTime=playing?playing.start+Math.max(0,(performance.now()-playStart)/1000):null;hits=[];for(const r of records){let re=r.end||end;if(re<start||r.start>end)continue;let x=xFor(r.frequency,p),y1=yFor(r.start,p,end),y2=yFor(re,p,end),top=Math.max(p.y,y1),bottom=Math.min(p.y+p.h,y2),height=Math.max(5,bottom-top);top=Math.max(p.y,Math.min(top,p.y+p.h-height));let selected=playing&&r.channel===playing.channel&&playTime>=r.start&&playTime<=re,box={x:x-8,y:top,w:16,h:height,r};ctx.strokeStyle=selected?'#fff':`hsl(${r.channel*31%360} 90% 60%)`;ctx.lineWidth=selected?4:2;ctx.setLineDash(r.end?[]:[6,4]);ctx.strokeRect(box.x,box.y,box.w,box.h);ctx.setLineDash([]);hits.push(box)}
 if(playing){let y=yFor(playTime,p,end);if(y>=p.y&&y<=p.y+p.h){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,y);ctx.lineTo(p.x+p.w,y);ctx.stroke()}statusEl.textContent=`▶ Channel ${playing.channel} timeline · ${(playTime-playing.start).toFixed(1)}s`}
 else statusEl.textContent=historyLoading?'Loading history…':(performance.now()<noticeUntil?notice:(offset>.05?`${offset.toFixed(1)}s behind ${timelineLive?'live':'end'}`:(audioOn?'Live A/V synced':(ARCHIVED?'Session end':''))));canvas.dataset.offset=offset.toFixed(3);canvas.dataset.span=String(SPAN);canvas.dataset.frames=String(frames.length);canvas.dataset.records=String(records.length);canvas.dataset.avDelay=avDelay().toFixed(2);canvas.dataset.historyLoading=historyLoading?'true':'false'}
function animate(now){if(now-lastPaint>=33){lastPaint=now;draw()}requestAnimationFrame(animate)}
function decodeFrames(items){return items.map(f=>{let raw=atob(f[2]),row=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)row[i]=raw.charCodeAt(i);return{seq:f[0],t:f[1],row}})}
function mergeTail(incoming){let bySeq=new Map(frames.map(f=>[f.seq,f]));for(const frame of incoming)bySeq.set(frame.seq,frame);frames=[...bySeq.values()].sort((a,b)=>a.t-b.t||a.seq-b.seq);let cutoff=timelineEnd-50;frames=frames.filter(f=>f.t>=cutoff);framesVersion++}
function windowCovered(target){return frames.length>1&&frames[0].t<=target-SPAN+.25&&frames.at(-1).t>=target-.25}
function queueHistory(force=false){let target=viewEnd();if(browseEnd===null&&!ARCHIVED&&!force)return;if(windowCovered(target))return;clearTimeout(historyTimer);let generation=++historyGeneration;historyTimer=setTimeout(()=>loadHistory(target,generation),force?0:70)}
async function loadHistory(target,generation){historyLoading=true;try{let r=await fetch(api(`/api/history?before=${(target+.001).toFixed(6)}&limit=900`));if(!r.ok)throw new Error(`history ${r.status}`);let j=await r.json();if(generation!==historyGeneration)return;applyTimeline(j.timeline);frames=decodeFrames(j.frames);records=j.records;framesVersion++}catch(e){}finally{if(generation===historyGeneration)historyLoading=false}}
async function poll(){let delay=timelineLive?80:1000;try{let since=Math.max(0,timelineEnd-45),expected=after,r=await fetch(api(`/api/updates?after=${after}&since=${since}`)),j=await r.json();if(!r.ok)throw new Error(`updates ${r.status}`);let incoming=decodeFrames(j.frames),atEnd=browseEnd===null;if(incoming.length&&expected&&incoming[0].seq>expected+1){after=0;if(atEnd){frames=[];records=[];framesVersion++}setTimeout(poll,0);return}for(const f of incoming)after=Math.max(after,f.seq);applyTimeline(j.timeline);if(atEnd){mergeTail(incoming);records=j.records}}catch(e){}setTimeout(poll,delay)}
document.querySelector('#live').onclick=()=>{browseEnd=null;offset=0;queueHistory(true)};
canvas.addEventListener('wheel',e=>{e.preventDefault();setOffset(offset+Math.sign(e.deltaY)*2,true)},{passive:false});
canvas.addEventListener('pointerdown',e=>{drag=e.clientY;moved=false;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(drag==null)return;let d=e.clientY-drag;moved||=Math.abs(d)>3;setOffset(offset+d/plotRect().h*SPAN);drag=e.clientY});canvas.addEventListener('pointerup',e=>{drag=null;if(moved){queueHistory(true);return}let b=canvas.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,p=plotRect(),end=viewEnd();for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(x>=h.x-8&&x<=h.x+h.w+8&&y>=h.y-5&&y<=h.y+h.h+5){let tappedTime=end-(p.y+p.h-y)/p.h*SPAN;startChannelPlayback(h.r.channel,tappedTime);break}}});
canvas.addEventListener('pointercancel',()=>{drag=null;moved=false;queueHistory(true)});
document.querySelector('#sq').oninput=async e=>{document.querySelector('#sqv').textContent=`${e.target.value} dB`;fetch(api(`/api/squelch?value=${e.target.value}`),{method:'POST'})};
function stopLiveSources(){for(const source of audioSources){try{source.stop()}catch(e){}}audioSources=[];audioNext=0}
function schedulePcm(bytes){let pcm=new Int16Array(bytes.buffer,bytes.byteOffset,bytes.byteLength/2),ab=audioCtx.createBuffer(1,pcm.length,AUDIO_RATE),d=ab.getChannelData(0);for(let i=0;i<pcm.length;i++)d[i]=pcm[i]/32768;let s=audioCtx.createBufferSource();s.buffer=ab;s.connect(audioCtx.destination);if(audioNext<audioCtx.currentTime+.04)audioNext=audioCtx.currentTime+.22;s.start(audioNext);audioNext+=ab.duration;audioSources.push(s);s.onended=()=>audioSources=audioSources.filter(x=>x!==s)}
async function liveStream(signal){if(!audioOn||signal.aborted)return;try{let response=await fetch(api('/api/live-stream'),{signal});if(!response.ok||!response.body)throw new Error(`audio stream ${response.status}`);let reader=response.body.getReader(),carry=new Uint8Array(0);while(audioOn&&!signal.aborted){let result=await reader.read();if(result.done)break;let joined=new Uint8Array(carry.length+result.value.length);joined.set(carry);joined.set(result.value,carry.length);let count=Math.floor(joined.length/AUDIO_CHUNK_BYTES);if(count>12){stopLiveSources();joined=joined.slice((count-8)*AUDIO_CHUNK_BYTES);count=8;audioNext=audioCtx.currentTime+.22}let used=count*AUDIO_CHUNK_BYTES;if(used)schedulePcm(joined.slice(0,used));carry=joined.slice(used)}}catch(e){}if(audioOn&&!signal.aborted)setTimeout(()=>liveStream(signal),250)}
function stopChannelPlayback(){playbackAbort?.abort();playbackAbort=null;for(const source of playbackSources){try{source.stop()}catch(e){}}playbackSources=[];playing=null;document.querySelector('#stopPlayback').hidden=true}
function scheduleChannelPcm(bytes){let pcm=new Int16Array(bytes.buffer,bytes.byteOffset,bytes.byteLength/2),ab=playbackCtx.createBuffer(1,pcm.length,AUDIO_RATE),d=ab.getChannelData(0);for(let i=0;i<pcm.length;i++)d[i]=pcm[i]/32768;let s=playbackCtx.createBufferSource();s.buffer=ab;s.connect(playbackCtx.destination);if(playbackNext<playbackCtx.currentTime+.04){let old=playbackNext;playbackNext=playbackCtx.currentTime+.22;if(old>0)playStart+=(playbackNext-old)*1000}s.start(playbackNext);playbackNext+=ab.duration;playbackSources.push(s);s.onended=()=>playbackSources=playbackSources.filter(x=>x!==s)}
async function channelStream(signal,channel,start){if(!playing||signal.aborted)return;let ended=false;try{let response=await fetch(api(`/api/channel-stream?channel=${channel}&start=${start.toFixed(6)}`),{signal});if(!response.ok||!response.body)throw new Error(`channel stream ${response.status}`);let reader=response.body.getReader(),carry=new Uint8Array(0);while(playing&&!signal.aborted){let result=await reader.read();if(result.done){ended=true;break}let joined=new Uint8Array(carry.length+result.value.length);joined.set(carry);joined.set(result.value,carry.length);let used=Math.floor(joined.length/AUDIO_CHUNK_BYTES)*AUDIO_CHUNK_BYTES;if(used)scheduleChannelPcm(joined.slice(0,used));carry=joined.slice(used)}}catch(e){}if(playing&&!signal.aborted){if(ARCHIVED&&ended){let wait=Math.max(0,(playbackNext-playbackCtx.currentTime)*1000);setTimeout(()=>{if(playing&&playing.channel===channel)stopChannelPlayback()},wait)}else{let resume=playing.start+Math.max(0,(performance.now()-playStart)/1000);setTimeout(()=>channelStream(signal,channel,resume),250)}}}
async function startChannelPlayback(channel,start){if(audioOn)document.querySelector('#audio').click();stopChannelPlayback();playbackCtx??=new AudioContext({latencyHint:'interactive'});await playbackCtx.resume();playing={channel,start};playbackNext=playbackCtx.currentTime+.22;playStart=performance.now()+220;playbackAbort=new AbortController();document.querySelector('#stopPlayback').hidden=false;channelStream(playbackAbort.signal,channel,start)}
document.querySelector('#stopPlayback').onclick=stopChannelPlayback;
document.querySelector('#audio').onclick=async e=>{if(ARCHIVED)return;audioOn=!audioOn;e.target.textContent=`Live audio: ${audioOn?'on':'off'}`;e.target.classList.toggle('active',audioOn);if(audioOn){stopChannelPlayback();stopLiveSources();audioCtx??=new AudioContext({latencyHint:'interactive'});await audioCtx.resume();audioNext=audioCtx.currentTime+.22;audioAbort=new AbortController();liveStream(audioAbort.signal)}else{audioAbort?.abort();audioAbort=null;stopLiveSources()}};
resize();poll();requestAnimationFrame(animate);
</script></body></html>
